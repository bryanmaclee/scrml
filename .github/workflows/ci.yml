# CI — the authoritative async gate (clean env). Never blocks a local push.
#
# Gate-layering (flogence gate-layering-methodology-2026-07-06 + scrml S242/S243; TUNED S253 cloud-PA arc):
#   types (`bun run types:check`; BLOCKING in `checks` below since S454 — NOT always-on local, nothing local
#   invokes it) · pre-commit fast subset (unit+integration+conformance, every commit)
#   · **CI (HERE) = the authoritative async gate** · R26 + adversarial /code-review (the PA's judgment).
#   (S365 fix round: this line previously advertised a layer that did not exist — `scripts/types-gate.ts`
#   was runnable and nothing ran it. That is the script's own thesis, one level up. Corrected AND wired.)
#
# S468 (s468-ci-speedup) — THE REQUIRED GATE IS NOW PARALLEL, AND IT IS BIGGER.
#   Until S468 `gate` was ONE serial job (~19.7 min: unit+conformance 7m43, host-global scan 5m09, browser
#   1m54, …). It is now a set of parallel jobs and a final AGGREGATOR job that is literally named `gate`:
#
#   • checks        — types gate, root-level parser/native tests, snippet gate, compile floor, facts, md shim,
#                     bootstrap-report currency (PR, path-scoped), conflict markers, SPEC-INDEX, delta-log,
#                     §34.0 row provenance. Every step runs even when an earlier one failed (each reports).
#   • unit          — `compiler/tests/unit` + `compiler/tests/conformance`, sharded (bun --shard=i/N).
#   • integration   — `compiler/tests/integration` (incl. security-await-pack) + `lsp` + `commands`,
#                     sharded. PROMOTED into the required gate at S468 (ran only in non-blocking
#                     `tracking` before — so the security pack gated nothing).
#   • browser       — TodoMVC gauntlet build + the browser tier's failure NAME-SET gate (once; it used to
#                     run in both `gate` and `tracking`).
#   • slices        — the self-host-v2 bootstrap slices + the e2e-render-map tier.
#   • host-global   — the S457 host-global alias scan, sharded BY EMISSION MODE (each leg a full corpus pass
#                     in its own modes — the scan already supports `--modes`, and its KNOWN_THROWS bookkeeping
#                     is scoped to the modes a run covers).
#   • gate          — the AGGREGATOR. `needs:` every job above, runs `if: always()`, and FAILS unless every one
#                     of them concluded `success` (failed / cancelled / skipped all fail it). It also checks that
#                     the sharded suites are an exact partition of their test files (scripts/ci-shards.ts
#                     reconcile): a shard that silently ran nothing cannot pass for a green suite.
#
#   ⚑ BRANCH PROTECTION IS UNCHANGED: the required status check is still the context `gate` (GitHub Actions
#   app), which is now the aggregator's check. No protection setting was touched. Do NOT give any other job
#   the name `gate`, and do NOT drop `if: always()` from it: a job whose `needs` failed is SKIPPED by
#   default, and a skipped required check reads as satisfied — the aggregator would then wave through
#   exactly the run it exists to stop.
#
#   NON-BLOCKING jobs: `tracking` (bootstrap conformance count + severity-table staleness, never in `gate`)
#   and `windows` (OS-path-separator surface; runs on main, nightly, and PRs touching path-handling code).
#
# KEY FINDING (S253): the local "full gate" (pre-push) partly PASSES ON UN-REPRODUCIBLE LOCAL ARTIFACTS —
# the self-host tests (`compiler/tests/self-host` AND `integration/self-host-smoke.test.js`) need a
# locally-built, gitignored dist that CANNOT be rebuilt on a clean checkout (the self-host `.scrml`
# sources don't compile against the current compiler: `null`/`!==`/`try` — the post-v1.0 self-host
# migration, master-list B4). A trustworthy cloud gate can only include what's reproducibly green from
# source; self-host + the M6.x within-node backlog + browser env-fails are tracked, not gated.
# S447 UPDATE: the v1 tree is gone (s447-retire-self-host-v1). compiler/tests/self-host was retired at
# S430; the v1-dist sections of self-host-smoke (§B bs.js, §C tab.js) and self-compilation (the
# "compiler compiles compiler" bootstrap) were deleted with compiler/self-host/. What remains of those
# two files exercises stdlib/compiler/ and skips when its gitignored dist is absent.
#
# WHY (S253): the prior ci.yml ran `bun test compiler/tests/` (EVERYTHING) → red on the M6.x within-node
# backlog + the un-rebuildable self-host dist. A gate red on known backlog can't be trusted to retire
# the redundant local pre-push full-suite (the wall-time). This gate == the guaranteed-green core; once
# confirmed green at origin, the local pre-push full-suite drops to the fast subset — the wall-time win.

name: CI

on:
  # S345 — `push` is scoped to `main`. Every OTHER branch is covered by `pull_request`.
  #
  # WHY: an unscoped `push` meant every PR ran the gate TWICE — once from the branch push,
  # once from the PR — both reporting under the required check name `gate`, so BOTH had to
  # be green. That is not redundancy, it is doubled exposure: with any intermittent in the
  # suite, a PR needs two independent clean runs instead of one, and today's landings each
  # burned several re-runs while the underlying tree was fine. It also cost real diagnostic
  # time, because two runs on one SHA reporting one check name reads as a contradiction
  # ("push fails, pull_request passes") that invites a wrong root-cause.
  #
  # ⚑ WHAT IS STILL GATED — unchanged: every PR (via `pull_request`), and every push to
  # `main` (the post-merge trunk check). Branch protection, the required `gate` check, and
  # `enforce_admins=true` are all untouched. This changes WHEN a run starts, never whether
  # a merge is allowed.
  #
  # THE HONEST COST: a feature branch with NO open PR gets no CI until a PR exists. That is
  # the standard trade and it is recoverable — `workflow_dispatch` below re-fires any ref
  # on demand.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'handOffs/**'
      - 'docs/**'
  pull_request:
  # S468 — NIGHTLY full run of `main`. Exists for the `windows` job (which no longer runs on every
  # PR — see its header), and doubles as a daily re-run of the whole gate on the trunk, which is
  # how an intermittent that slipped through a PR shows up without waiting for the next merge.
  schedule:
    - cron: "41 6 * * *"
  # S326 — MANUAL RE-FIRE. Added because a dropped trigger had no recovery path.
  #
  # GitHub does not re-deliver a webhook it dropped. During the 2026-08-06 Actions
  # outage ("webhook triggers remain throttled; many push/pull request events aren't
  # triggering runs") FIVE PRs sat with ZERO checks and therefore could not merge,
  # `gate` being the sole required check. S325 burned a whole session on it and tried
  # force-push, close/reopen, a new commit and a brand-new PR — all four produced
  # nothing, because every one of them is just another webhook into the same throttled
  # pipe. This is the SECOND outage with no lever; the first cost a session's landings.
  #
  #   gh workflow run CI --ref <branch>
  #
  # ⚑ CONSTRAINT, MEASURED not assumed (S326 bite proof): the dispatch reads the workflow
  # definition FROM THE TARGET REF, so `--ref <branch>` fails `HTTP 422: Workflow does not
  # have 'workflow_dispatch' trigger` on any branch cut BEFORE this landed. Rebase the branch
  # onto main first, or dispatch `--ref main`. Consequence worth stating plainly: this lever
  # is prospective, not retroactive — it will not rescue a branch that predates it.
  #
  # ⚑ This WEAKENS NO GATE. It adds a way to START a run; it does not add a way to skip
  # one. `gate` must still go green on the head SHA before a merge is allowed, and
  # `enforce_admins=true` is untouched.
  #
  # ONE HONEST CAVEAT — a dispatched run's §34.0 row-provenance check is WEAKER. Step
  # `s34-census --check-new --base` reads `github.event.pull_request.base.sha`, which does
  # not exist on a manual run, so it falls back to `HEAD~1`. On a multi-commit branch that
  # compares against the previous commit rather than the merge base, so rows added in EARLIER
  # commits of the same branch are not seen as NEW. Every other step is event-independent.
  workflow_dispatch: {}

# S468: the event name is part of the group so the nightly `schedule` run of main and a `push`
# run of main do not cancel each other (both have ref refs/heads/main). Per-PR behaviour is
# unchanged: a new push to a PR cancels that PR's in-flight run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # checks — the fast deterministic gates. Each step is `if: !cancelled()` so one red step does not
  # hide the rest (a failed step otherwise halts the job and every later check reads `skipped`).
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 — the §34.0 row-provenance gate and the bootstrap-report currency check diff
      # against the PR base SHA, and a shallow clone has no common ancestry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"   # no browser in this job
        run: bun install --frozen-lockfile
      # S365 / S454 — the compiler's own TypeScript diagnostics do not change silently. BLOCKING.
      # `scripts/types-gate.ts --check` diffs `tsc --noEmit --strict` over compiler/src against the
      # NAME->COUNT baseline in compiler/tests/TYPES-BASELINE.json and exits 1 on ANY difference, in
      # EITHER direction (a GONE/SHRUNK entry means the baseline is stale — re-record with `--write`).
      # It sat red unseen for ~32 merges as a continue-on-error `tracking` step before S454 promoted it.
      # > Provenance: ruling:user-voice-scrml.md S454 "yes, fix the 30 then promote it"
      - name: Types gate (diagnostic NAME-SET vs compiler/tests/TYPES-BASELINE.json)
        run: bun scripts/types-gate.ts --check
      # S302: the ROOT-LEVEL test files (parser-conformance-*, native-*) were run by NO workflow at
      # all, and a 38-failure native-parity regression passed pre-commit AND the required gate.
      # Deterministic (no dist / browser / network deps), seconds. See
      # g-parity-canary-outside-every-blocking-gate.
      - name: Root-level parser/native conformance (S302 — previously ungated)
        if: ${{ !cancelled() }}
        run: bun test compiler/tests/*.test.js
      - name: Snippet gate (every public-cited .scrml still compiles)
        if: ${{ !cancelled() }}
        run: bun scripts/snippet-gate.js
      # ABSOLUTE floor (NOT differential): every shipped showcase PROGRAM (examples/* + multi-file
      # example/benchmark apps) must build on HEAD. corpus-emit-differential is base-vs-head and treats
      # compile-failure as DATA, so a program broken since before the baseline is invisible to it — that
      # is how examples/09 failed to compile from S236 uncaught for months
      # (g-corpus-differential-gate-blind-to-standing-breakage). Known-broken programs are baselined
      # (scripts/corpus-compile-floor.baseline.json, each naming its gap); a NEW break — or a stale
      # baseline entry — fails.
      - name: Compile-floor gate (every showcase program still builds on HEAD)
        if: ${{ !cancelled() }}
        run: bun scripts/corpus-compile-floor.ts --check
      - name: Facts gate (published figures still match the repo)
        if: ${{ !cancelled() }}
        run: bun scripts/facts.ts --check
      # S462 md phase 1 — the scrml:md runtime shim is impl#1's compile of the scrml reader
      # (SPEC §67.8, one md reader); it must be byte-current with the source AND the compiler.
      - name: scrml:md shim gate (compiler/runtime/stdlib/md.js generated from stdlib/md/index.scrml)
        if: ${{ !cancelled() }}
        run: bun scripts/gen-md-shim.ts --check
      # S457 — docs/bootstrap-conformance.md went STALE for SEVEN consecutive map windows while its
      # `--check` sat in continue-on-error `tracking` (non-compliance N-S455-3). BLOCKING here, but
      # PATH-SCOPED: only a pull request whose diff touches `conformance/cases/**` or
      # `compiler/self-host-v2/**` must leave the report current. What blocks is STALENESS only — the
      # FAIL count never sets the exit status. Remedy: `bun scripts/bootstrap-conformance.ts --write`.
      #
      # PR-ONLY: on a push to `main` there is no PR base, and two individually-current corpus PRs can
      # merge into a stale combination; failing the trunk check for that would be cry-wolf. `tracking`
      # reports staleness on every run where THIS step did not run (S468: once, not twice).
      #
      # HONEST LIMIT: the report also reads impl#1's front end (`compiler/src/commands/fix-s66.js`) and
      # `conformance/*.ts`, so a PR touching only those can stale it without tripping this step.
      # `git diff` erroring (bad base SHA) counts as "touched" — the check runs (fail closed).
      - name: Bootstrap conformance report current (PRs touching conformance/cases or self-host-v2)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if git diff --quiet "${{ github.event.pull_request.base.sha }}"...HEAD -- conformance/cases compiler/self-host-v2; then
            echo "no conformance/cases or compiler/self-host-v2 change in this PR — report currency not required here"
          else
            bun scripts/bootstrap-conformance.ts --check
          fi
      # S409 — an unresolved merge conflict reached `main` at e74f5423 (#900) and the gate was GREEN.
      - name: Conflict-marker gate (no unresolved merge markers on the trunk)
        if: ${{ !cancelled() }}
        run: bun scripts/conflict-marker-gate.ts
      # S409 — gates every Sections row's range/size AND asserts the scan reached all sections (a
      # stray line ends the table scan, and a zero over a partial scan is not a pass).
      - name: SPEC-INDEX currency gate (totals + every row's range + full-scan coverage)
        if: ${{ !cancelled() }}
        run: bun run scripts/regen-spec-index.ts --check
      # A duplicate delta-log sequence number silently drops an entry from the flogence digest.
      # BASELINED (handOffs/delta-log-dupes.baseline.json) — only a NEW duplicate fails.
      - name: delta-log sequence gate (a duplicate silently drops an entry from the digest)
        if: ${{ !cancelled() }}
        run: bun scripts/delta-lint.ts
      # SPEC §34.0 — a NEW catalog row must state where it fires, or honestly declare it does not yet.
      # DIFF-SCOPED: silent on the legacy corpus by construction.
      - name: §34.0 row-provenance gate (new error-code rows state where they fire)
        if: ${{ !cancelled() }}
        run: bun scripts/s34-census.ts --check-new --base ${{ github.event.pull_request.base.sha || 'HEAD~1' }}

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # unit — unit + conformance, sharded across the matrix with bun's own `--shard=i/N`.
  # `scripts/ci-test-timings.json` only BALANCES the legs (bun assigns files by recorded duration);
  # a stale or absent entry changes which leg runs a file, never whether it runs. The `gate`
  # aggregator proves the legs are an exact partition of the suite's test files.
  # No `pretest` here: nothing under unit/ or conformance/ reads samples/compilation-tests/dist
  # (the windows job has always run this suite without it).
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  unit:
    name: unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"   # no browser in unit/conformance
        run: bun install --frozen-lockfile
      - name: unit + conformance — shard ${{ matrix.shard }}/3
        run: >-
          bun test compiler/tests/unit compiler/tests/conformance
          --shard=${{ matrix.shard }}/3
          --timings="$RUNNER_TEMP/timings.json" --timings=scripts/ci-test-timings.json --update-timings
          --reporter=junit --reporter-outfile="$RUNNER_TEMP/junit-unit-${{ matrix.shard }}-of-3.xml"
      - name: Upload shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-unit-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/junit-unit-${{ matrix.shard }}-of-3.xml
            ${{ runner.temp }}/timings.json
          retention-days: 14
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # integration — integration (incl. security-await-pack) + lsp + commands, sharded. S468 PROMOTED
  # these from non-blocking `tracking` into the required gate. They were green there except ONE
  # intermittent, `§2 stopping scrml dev mid-respawn … SIGTERM` (compiler/tests/commands/
  # dev-child-dies-with-parent.test.js — 4 of the last 60 runs), FIXED at S468 rather than moved: the
  # test edited the entry the moment `scrml dev` logged "Serving", which can land before the dev
  # parent has taken its stat snapshot / registered its directory watch, so that edit was never seen
  # and the respawn never came. The test now re-edits until the respawn appears.
  # `pretest` runs here: integration/s464-quoted-handler-refused reads samples/compilation-tests/dist.
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  integration:
    name: integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"   # no browser in integration/lsp/commands
        run: bun install --frozen-lockfile
      - name: Populate test fixtures (samples/compilation-tests/dist)
        run: bun run pretest
      - name: integration + lsp + commands — shard ${{ matrix.shard }}/3
        run: >-
          bun test compiler/tests/integration compiler/tests/lsp compiler/tests/commands
          --shard=${{ matrix.shard }}/3
          --timings="$RUNNER_TEMP/timings.json" --timings=scripts/ci-test-timings.json --update-timings
          --reporter=junit --reporter-outfile="$RUNNER_TEMP/junit-integration-${{ matrix.shard }}-of-3.xml"
      - name: Upload shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-integration-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/junit-integration-${{ matrix.shard }}-of-3.xml
            ${{ runner.temp }}/timings.json
          retention-days: 14
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # browser — the TodoMVC gauntlet + the browser tier's failure NAME-SET gate. Runs ONCE (until S468
  # the tier ran in both `gate` and `tracking`).
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps (incl. puppeteer's Chromium)
        run: bun install --frozen-lockfile
      - name: Populate browser-test fixtures (samples/compilation-tests/dist)
        run: bun run pretest
      - name: Gauntlet quick check (TodoMVC compiles + emitted JS parses)
        run: |
          bun run compiler/src/cli.js compile benchmarks/todomvc/app.scrml --convert-legacy-css
          node --check benchmarks/todomvc/dist/app.client.js
      # S313 (bryan RULED promote): the browser tier is assertable by its failure NAME SET, so it is
      # BLOCKING. `--check` exits 0 while the set is unchanged and 1 the moment a name joins or leaves.
      # Placement is deliberate: AFTER the gauntlet step, which materialises benchmarks/todomvc/dist, so
      # the script's two env-exclusions are moot here. NOT in pre-push: local environments vary more
      # than CI, and a local difference is what made the first recorded baseline wrong.
      - name: Browser tier failure NAME-SET gate (S313 — a regression here blocks)
        run: bun scripts/browser-baseline.ts --check

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # slices — the native bootstrap (impl#2, compiler/self-host-v2/) + the e2e-render-map tier.
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  slices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps (incl. Chromium — slice-m3's css oracle drives puppeteer)
        run: bun install --frozen-lockfile
      # S437 — the native bootstrap lives outside the bunfig test root, so a plain `bun test` never runs
      # it. The no-default-arm lint enforces dpa-051 §3.4 (total matches over IR enums); the slice
      # suite is M1's oracle for M2's `lower`. M2: parse → analyze → lower, plus the M1 suite re-run on
      # the LOWERED programs (SLICE_CORE=lowered). S444 slice-m4 (§66.19 programs compiled from source
      # and run). S446 slice-codec (§57 wire codec). (S468: `compiler/tests/integration/self-host-v2-lexer`
      # is no longer run here — the `integration` job runs it as part of the integration suite.)
      - name: Bootstrap slice (self-host-v2) — no-default-arm lint + M1 + M2 front end + M3 + M4 §66.19 programs + §57 codec
        run: |
          bun scripts/lint-no-default-arm.js
          bun test ./compiler/self-host-v2/slice-m1/
          bun test ./compiler/self-host-v2/slice-m2/
          SLICE_CORE=lowered bun test ./compiler/self-host-v2/slice-m1/
          bun test ./compiler/self-host-v2/slice-m3/
          bun test ./compiler/self-host-v2/slice-m4/
          bun test ./compiler/self-host-v2/slice-codec/
      # S427: the e2e-render-map tier ran in NO job and NO hook (the root glob does not descend and the
      # pre-commit globs stop at the same depth). What is BLOCKING is the tier's ASSERTIONS; the
      # fast-slice green->red delta is WARN-only by design. Happy-dom only. See
      # g-e2e-render-map-tier-runs-in-no-ci-job-at-all.
      - name: e2e-render-map tier assertions (S427 — previously ran in no job)
        if: ${{ !cancelled() }}
        run: bun test compiler/tests/e2e-render-map/

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # host-global — S457 2a / S458: compiler references to host globals go through the `_scrml_g`
  # alias, so no user binding can capture them. The scan compiles the whole corpus (samples, examples
  # incl. multi-file programs, conformance, stdlib, benchmarks) in every emission mode and scope-
  # analyses every emitted artifact.
  #
  # S468 — WHY IT TOOK 5 MIN AND WHY IT IS SHARDED (not path-filtered). It is CPU-bound: ~2,850 units ×
  # 6 modes ≈ 7,000 full compiles + a scope walk of ~10,500 artifacts, already spread over 6 worker
  # processes on a 4-vCPU runner. There is nothing to cache across runs — its inputs are the compiler
  # and the whole corpus, which is what nearly every PR changes. A "run only when inputs change"
  # filter would therefore skip almost nothing, and its input list (compiler/src, compiler/runtime,
  # stdlib, five corpus roots, the script, the lockfile…) is a list that rots into a silent hole the
  # day someone adds an input. Splitting BY MODE keeps the guarantee whole on every run: each leg is a
  # complete corpus pass in its modes, and the script's KNOWN_THROWS "no longer throws" accounting
  # is already scoped to the modes a run covers, so the legs never misreport each other's keys.
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  host-global:
    name: host-global (${{ matrix.modes }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every mode exactly once across the legs. `test` and `library` compile only the sources that
        # use them, so they ride with a full-corpus mode.
        modes: ["default,test", "esm,library", "embed", "build"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: bun install --frozen-lockfile
      - name: Host-global alias gate — modes ${{ matrix.modes }}
        run: bun scripts/host-global-scan.ts --check --modes ${{ matrix.modes }}

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # gate — THE REQUIRED CHECK. Aggregates every blocking job above. See the header: it must stay
  # `if: always()`, and it must stay the only job named `gate`.
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  gate:
    if: ${{ always() }}
    needs: [checks, unit, integration, browser, slices, host-global]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every blocking job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null; then
            echo "gate: every blocking job concluded success"
          else
            echo "::error::gate: a blocking job did not succeed (failure, cancellation and skip all count)"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
      - uses: oven-sh/setup-bun@v2
        if: ${{ !cancelled() }}
      - name: Download shard reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-*
          path: ${{ runner.temp }}/reports
      # The sharded suites must be an exact PARTITION of their test files: every leg reported, no file
      # in two legs, no test file under the suite's directories run by no leg. Prints the summed
      # file / test counts per suite (compare: one unsharded unit+conformance run = 1284 files).
      - name: Sharded suites are an exact partition (scripts/ci-shards.ts reconcile)
        if: ${{ !cancelled() }}
        run: >-
          bun scripts/ci-shards.ts reconcile "$RUNNER_TEMP/reports"
          unit=compiler/tests/unit,compiler/tests/conformance
          integration=compiler/tests/integration,compiler/tests/lsp,compiler/tests/commands

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # tracking — NON-BLOCKING. Backlog reports that must stay visible but must never gate (a red gate
  # over a backlog is the cry-wolf shape). STEP-LEVEL continue-on-error on every step, on purpose: a
  # failed step HALTS the job even in a continue-on-error job (verified on run 30742472551).
  # S468: integration + lsp + commands and the browser tier LEFT this job (now in the gate).
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  tracking:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the same base diff the blocking currency step makes (de-dup below)
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: bun install --frozen-lockfile
      # S449 — how many conformance cases the PURE bootstrap passes; `--check` exits 1 only when
      # docs/bootstrap-conformance.md is stale. S468 DE-DUP: on a PR that touches conformance/cases or
      # compiler/self-host-v2 the BLOCKING `checks` step runs this exact check, so it is not run twice;
      # here it reports staleness on every OTHER run (push, nightly, dispatch, untouched PRs). The
      # touched-test below is byte-for-byte the blocking step's, so exactly one of the two runs.
      - name: Bootstrap conformance count (tracking; report staleness)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && ! git diff --quiet "${{ github.event.pull_request.base.sha }}"...HEAD -- conformance/cases compiler/self-host-v2; then
            echo "this PR touches conformance/cases or compiler/self-host-v2 — the blocking 'checks' job runs this check; not repeated here"
          else
            bun scripts/bootstrap-conformance.ts --check
          fi
      # s451-boot-diag-severity — compiler/self-host-v2/severity.scrml is GENERATED from SPEC §34.
      # Staleness is TRACKED, not gated (a docs-only §34 row can stale it without changing any answer);
      # the SEMANTIC check is in slice-m4/severity.test.js. Regenerate: `bun scripts/gen-bootstrap-severity.ts`.
      - name: Bootstrap severity table (tracking; report staleness)
        continue-on-error: true
        run: bun scripts/gen-bootstrap-severity.ts --check

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # windows — NON-BLOCKING (continue-on-error; NOT a required check). Surfaces OS-path-separator
  # regressions invisible on Linux: #25 nested-pages prefix, #26 isStdlibFilePath auth-bypass (both
  # `\` vs `/`), and the S417 e2e-render-map tier that minted every relpath with `\`.
  #
  # S468 — WHEN IT RUNS. Every push to main, the nightly schedule, manual dispatch, and a PR whose diff
  # touches code where an OS path is built, split, compared or resolved:
  #   compiler/src/**            module resolution, the CLI + commands, file IO, route/page paths (#25, #26)
  #   compiler/bin/**            the CLI entry
  #   compiler/runtime/**        the server runtime serves and resolves files
  #   stdlib/**                  stdlib modules that touch the host file system (stdlib/host/…)
  #   compiler/tests/helpers/**  shared test infra (tmp roots, path helpers) every test inherits
  #   compiler/tests/e2e-render-map/**  the tier whose own path minting was the S417 class
  #   bunfig.toml, package.json, bun.lock, .github/workflows/ci.yml   the job's own toolchain
  # A test-only PR elsewhere does not trigger it: a test that hardcodes `/` is caught on the next push
  # to main or the nightly. The decision is made INSIDE the job (so the job always reports), from the
  # pull_request merge commit's own two parents — fail closed: if the diff cannot be computed, it runs.
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the PR merge commit + its two parents — enough for the path check below
      - name: Does this run need the Windows suite?
        id: need
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "event ${{ github.event_name }} — always runs"; exit 0
          fi
          if ! changed=$(git diff --name-only HEAD^1 HEAD 2>/dev/null); then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "could not compute the PR diff — running (fail closed)"; exit 0
          fi
          hits=$(printf '%s\n' "$changed" | grep -E '^(compiler/src/|compiler/bin/|compiler/runtime/|stdlib/|compiler/tests/helpers/|compiler/tests/e2e-render-map/|bunfig\.toml$|package\.json$|bun\.lock$|\.github/workflows/ci\.yml$)' || true)
          if [ -n "$hits" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "path-handling files changed:"; printf '%s\n' "$hits" | head -40
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no path-handling file changed in this PR — Windows suite not needed (it runs on main + nightly)"
          fi
      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.need.outputs.run == 'true' }}
      - name: Install deps
        if: ${{ steps.need.outputs.run == 'true' }}
        # S314 — skip puppeteer's chrome-headless-shell download: no browser runs here, and the download
        # was a flake source (`ECONNRESET` in the postinstall failed this job on PR #382).
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: bun install --frozen-lockfile
      - name: Unit + conformance on Windows (catches `\` vs `/` OS-path bugs — #25/#26 class)
        if: ${{ steps.need.outputs.run == 'true' }}
        run: bun test compiler/tests/unit compiler/tests/conformance
      # S427: the e2e-render-map tier was a SILENT WHOLE-TIER NO-OP on Windows (S417: every relpath
      # minted with `\`, 0 of 449 baseline keys resolved, the tier reported green).
      - name: e2e-render-map tier on Windows (S427 — the S417 separator class)
        if: ${{ steps.need.outputs.run == 'true' }}
        run: bun test compiler/tests/e2e-render-map/
