# CI — the authoritative async gate (clean env). Never blocks a local push.
#
# Gate-layering (flogence gate-layering-methodology-2026-07-06 + scrml S242/S243; TUNED S253 cloud-PA arc):
#   types (`bun run types:check`; NON-BLOCKING in `tracking` below — NOT always-on local, nothing local
#   invokes it) · pre-commit fast subset (unit+integration+conformance, ~2min, every commit)
#   · **CI (HERE) = the authoritative async gate** · R26 + adversarial /code-review (the PA's judgment).
#   (S365 fix round: this line previously advertised a layer that did not exist — `scripts/types-gate.ts`
#   was runnable and nothing ran it. That is the script's own thesis, one level up. Corrected AND wired.)
#
# THREE jobs:
#   • gate     — BLOCKING. The REPRODUCIBLY-GREEN-FROM-SOURCE core: unit + conformance (pure compiler
#                correctness + the language conformance suite; no dist/env deps) + the TodoMVC gauntlet
#                + the failure-NAME-SET gates over the two tiers that carry a documented failure
#                baseline: **browser** (since S313) and **self-host** (since S409 — the tier is
#                dist-independent and runs in ~0.6s; see the KEY FINDING block below, which corrects
#                the claim that used to exclude it).
#                This is the merge-gate. Promote integration/lsp/commands into gate once each confirms
#                green in `tracking` (integration needs self-host-smoke relocated/dist-guarded first).
#   • tracking — NON-BLOCKING (continue-on-error). integration (contains the dist-dependent
#                self-host-smoke) + lsp + commands + browser (REAL fails, e.g. g-emit-lift-markup-text-
#                interp) + the M6.x within-node parser-parity backlog + canary. Visible, never blocks.
#   • windows  — NON-BLOCKING (continue-on-error). unit + conformance on windows-latest — surfaces the
#                OS-path-separator regressions the Linux gate can't see (#25/#26 `\` vs `/`). Promote into
#                `gate` (windows-latest matrix) once green. The owed Windows-CI runner (4th+ OS-path report).
#
# KEY FINDING (S253): the local "full gate" (pre-push) partly PASSES ON UN-REPRODUCIBLE LOCAL ARTIFACTS —
# the self-host tests (`compiler/tests/self-host` AND `integration/self-host-smoke.test.js`) need a
# locally-built, gitignored dist that CANNOT be rebuilt on a clean checkout (the self-host `.scrml`
# sources don't compile against the current compiler: `null`/`!==`/`try` — the post-v1.0 self-host
# migration, master-list B4). A trustworthy cloud gate can only include what's reproducibly green from
# source; self-host + the M6.x within-node backlog + browser env-fails are tracked, not gated.
#
# ⛑ S409 — HALF OF THE PARAGRAPH DIRECTLY ABOVE IS FALSE, AND IT IS THE HALF THAT KEPT A WHOLE TEST
# DIRECTORY OUT OF EVERY GATE FOR A YEAR. It is kept rather than deleted because it reads like a
# measured finding and never was one: `compiler/tests/self-host` was named in the same breath as
# `integration/self-host-smoke.test.js` and inherited that file's exclusion WITHOUT EVER BEING
# MEASURED SEPARATELY.
#
# MEASURED, NOT ASSUMED — two independent ways, both at fd69d1fc:
#   (a) `compiler/self-host/dist/` (14 files, gitignored) moved ENTIRELY out of the tree, tier re-run;
#   (b) a fresh worktree, in which `dist/` (ignored at .gitignore:2) had never materialised at all.
# Both readings: 139 pass · 122 skip · 3 fail · 264 tests across 4 files · under 0.6s, with an
# IDENTICAL failure NAME SET. `compiler/tests/self-host` COMPILES ITS INPUTS AT TEST TIME, and
# `bs.test.js` self-skips with an explicit message when `bs.scrml` fails to compile — it never reads a
# built dist at all. The tier is DIST-INDEPENDENT and it is FAST.
#
# SO IT IS NOW FAILURE-NAME-SET GATED IN THE BLOCKING `gate` JOB, beside the browser one, against
# `compiler/tests/self-host/FAILURE-BASELINE.json` — 3 token-count parity failures, ZERO
# env-exclusions. WHY THAT IS WORTH A BLOCKING STEP RATHER THAN A TRACKING ONE: the #924 defect
# rewrote the character class `/[A-Za-z0-9_\-:@]/` in `compiler/self-host/tab.scrml` into a map
# literal, made `isAttrIdentPart` return false for EVERY character, and turned a tokenizer loop into an
# unbounded allocator — an 82 GB host lockup that cost a day and three hard resets and sat
# unattributed for sessions (fixed at 6951baa5). Nothing in any gated path executed that directory, so
# it reached nobody's gate.
#
# WHAT SURVIVES OF THE S253 CLAIM: `integration/self-host-smoke.test.js`. That is a DIFFERENT file, it
# was NOT measured here, and no claim is made about it in either direction — it stays in `tracking`
# via the `integration` step. The `null`/`!==`/`try` migration (master-list B4) is likewise unaffected:
# it is WHY `bs.scrml` fails to compile, and the tier's own 122 skips are the honest report of that.
#
# WHY (S253): the prior ci.yml ran `bun test compiler/tests/` (EVERYTHING) → red on the M6.x within-node
# backlog + the un-rebuildable self-host dist. A gate red on known backlog can't be trusted to retire
# the redundant local pre-push full-suite (the wall-time). This gate == the guaranteed-green core; once
# confirmed green at origin, the local pre-push full-suite drops to the fast subset — the wall-time win.

name: CI

on:
  # S345 — `push` is scoped to `main`. Every OTHER branch is covered by `pull_request`.
  #
  # WHY: an unscoped `push` meant every PR ran the gate TWICE — once from the branch push,
  # once from the PR — both reporting under the required check name `gate`, so BOTH had to
  # be green. That is not redundancy, it is doubled exposure: with any intermittent in the
  # suite, a PR needs two independent clean runs instead of one, and today's landings each
  # burned several re-runs while the underlying tree was fine. It also cost real diagnostic
  # time, because two runs on one SHA reporting one check name reads as a contradiction
  # ("push fails, pull_request passes") that invites a wrong root-cause.
  #
  # ⚑ WHAT IS STILL GATED — unchanged: every PR (via `pull_request`), and every push to
  # `main` (the post-merge trunk check). Branch protection, the required `gate` check, and
  # `enforce_admins=true` are all untouched. This changes WHEN a run starts, never whether
  # a merge is allowed.
  #
  # THE HONEST COST: a feature branch with NO open PR gets no CI until a PR exists. That is
  # the standard trade and it is recoverable — `workflow_dispatch` below re-fires any ref
  # on demand.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'handOffs/**'
      - 'docs/**'
  pull_request:
  # S326 — MANUAL RE-FIRE. Added because a dropped trigger had no recovery path.
  #
  # GitHub does not re-deliver a webhook it dropped. During the 2026-08-06 Actions
  # outage ("webhook triggers remain throttled; many push/pull request events aren't
  # triggering runs") FIVE PRs sat with ZERO checks and therefore could not merge,
  # `gate` being the sole required check. S325 burned a whole session on it and tried
  # force-push, close/reopen, a new commit and a brand-new PR — all four produced
  # nothing, because every one of them is just another webhook into the same throttled
  # pipe. This is the SECOND outage with no lever; the first cost a session's landings.
  #
  #   gh workflow run CI --ref <branch>
  #
  # ⚑ CONSTRAINT, MEASURED not assumed (S326 bite proof): the dispatch reads the workflow
  # definition FROM THE TARGET REF, so `--ref <branch>` fails `HTTP 422: Workflow does not
  # have 'workflow_dispatch' trigger` on any branch cut BEFORE this landed. Rebase the branch
  # onto main first, or dispatch `--ref main`. Consequence worth stating plainly: this lever
  # is prospective, not retroactive — it will not rescue a branch that predates it.
  # Proven both ways: `--ref docs/s326-continuity` (pre-merge cut) → 422; `--ref main` → run
  # 31140159467, **all three jobs green including `gate`**, which also confirms the census
  # fallback below does not break a dispatched run.
  #
  # ⚑ This WEAKENS NO GATE. It adds a way to START a run; it does not add a way to skip
  # one. `gate` must still go green on the head SHA before a merge is allowed, and
  # `enforce_admins=true` is untouched. The fork-rule row that matters is root-vs-position:
  # nudging a PR treats the symptom, a manual trigger removes the class.
  #
  # ONE HONEST CAVEAT — a dispatched run's §34.0 row-provenance check is WEAKER. Step
  # `s34-census --check-new --base` reads `github.event.pull_request.base.sha`, which does
  # not exist on a manual run, so it falls back to `HEAD~1` (a fallback that already
  # existed; this is not new behaviour). On a multi-commit branch that compares against the
  # previous commit rather than the merge base, so rows added in EARLIER commits of the
  # same branch are not seen as NEW. Every other step is event-independent and identical.
  # Prefer a real push/PR event when one is available; reach for this when the platform
  # has eaten the event.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # ⛔ S409 — THE BLOCKING GATE HAD NO TIME BUDGET AT ALL, AND THE DEFECT CLASS IT WAS JUST HARDENED
    # AGAINST IS ONE IT COULD NOT HAVE REPORTED. Before this line, no `timeout-minutes` existed
    # anywhere in this file, so every job inherited GitHub's default of **360 minutes**.
    #
    # WHY THAT IS NOT ACADEMIC HERE. The defect that justifies the new self-host step (#924) is a
    # SYNCHRONOUS unbounded loop — `isAttrIdentPart` returned false for every character and a
    # tokenizer loop never advanced. bun's per-test timeout cannot preempt synchronous work, and the
    # name-set script's own loud-failure paths do not fire either: `!ranOk` needs bun to EXIT, and the
    # OOM route needs the loop to ALLOCATE. A non-allocating spin does neither. So a recurrence would
    # have HUNG THIS GATE FOR SIX HOURS instead of reddening it — which fails the standard this repo
    # states in `scripts/tier-baseline.ts` itself: *"A hung gate job is strictly worse than a failed
    # one (pa-base §8 — a gate must be able to report)."* An unreported gate is a gate that cannot
    # fail, and a gate that cannot fail is indistinguishable from one that never runs.
    #
    # WHY 20 AND NOT SOME OTHER NUMBER — measured, not guessed. The whole gate sequence was timed
    # locally at S409, step by step: unit+conformance 85.9s · root glob 11.3s · gauntlet 0.4s ·
    # browser name-set 24.0s · **self-host name-set 0.7s** · snippet-gate 32.0s · compile-floor 5.0s ·
    # facts 0.2s · conflict-marker 0.1s · SPEC-INDEX 0.02s · delta-lint 0.03s = **160 s total**. CI
    # adds checkout + setup-bun + `bun install` + `pretest` + the §34 census, on a runner materially
    # slower than that machine; call it 10-13 min pessimistically. 20 gives ~1.5-2x headroom over the
    # pessimistic case and ~7x over the measured core — loose enough that a slow runner never flaps it
    # red, tight enough that a hang is a 20-minute signal instead of a 6-hour one.
    # ⚠ Raise this if the gate genuinely grows; do NOT raise it to make a hang pass.
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 — the §34.0 row-provenance gate diffs against the PR base SHA, and a shallow
      # clone has no common ancestry, so merge-base fails and the gate cannot resolve what is NEW.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Populate browser-test fixtures (samples/compilation-tests/dist)
        run: bun run pretest
      - name: Gate suite (unit + conformance — reproducibly green from source)
        run: bun test compiler/tests/unit compiler/tests/conformance
      # S302: the 14 ROOT-LEVEL test files (parser-conformance-*, native-*) were run by
      # NO workflow at all — 13 of 14 had no runner anywhere, and the 14th
      # (parser-conformance-within-node) ran only in `tracking`, which is
      # continue-on-error:true. They are also outside the pre-commit hook's
      # unit/integration/conformance scope. A 38-failure native-parity regression
      # therefore passed pre-commit AND this required gate, surfacing solely as a red
      # `tracking` — the job we routinely (and correctly) read as the documented
      # browser/serve-tool baseline. A gate that is correctly non-blocking and
      # habitually red is where a real regression hides.
      # Deterministic (no dist / browser / network deps) and ~16s. Green at wiring
      # time: 6394 tests, 0 fail. See g-parity-canary-outside-every-blocking-gate.
      - name: Root-level parser/native conformance (S302 — previously ungated)
        run: bun test compiler/tests/*.test.js
      - name: Gauntlet quick check (TodoMVC compiles + emitted JS parses)
        run: |
          bun run compiler/src/cli.js compile benchmarks/todomvc/app.scrml --convert-legacy-css
          node --check benchmarks/todomvc/dist/app.client.js
      # S313 (bryan RULED promote): the browser tier is now assertable by its failure NAME SET, so it
      # belongs in the BLOCKING gate rather than in continue-on-error `tracking`. Before this the tier
      # was excluded from every blocking gate precisely because an exit code cannot express "the same
      # failures as before" — it always exits 1. `--check` exits 0 while the set is unchanged and 1 the
      # moment a name joins or leaves it, which is a condition a gate CAN carry.
      #
      # Placement is deliberate: this sits AFTER the gauntlet step, which compiles the TodoMVC
      # benchmark and therefore materialises benchmarks/todomvc/dist. That makes the script's two
      # env-exclusions moot IN THIS JOB (the pair passes here) — they still matter in `tracking`, which
      # never builds it. The check is correct either way; both sides of the comparison are filtered.
      #
      # NOT added to pre-push: local environments vary far more than CI, and it was exactly a local
      # environment difference that made the first recorded baseline wrong.
      #
      # ⛑ S409: the script was `scripts/browser-baseline.ts` until this session. It is now
      # `scripts/tier-baseline.ts --tier=<name>`, parameterised over a registry, defaulting to
      # `browser`. This invocation is BEHAVIOUR-IDENTICAL — proven by running the pre-rename script
      # and the post-rename one in the same environment and diffing the output (byte-identical, both
      # exit 0). The rename is the point: a file called `browser-baseline.ts` is one nobody thinks to
      # aim at a second tier, and the step directly below went unwritten for a year while this one
      # sat here working.
      - name: Browser tier failure NAME-SET gate (S313 — a regression here now blocks)
        run: bun scripts/tier-baseline.ts --tier=browser --check
      # S409 (bryan RULED). NOTHING IN ANY GATED PATH EXECUTED `compiler/tests/self-host` — neither CI
      # job ran it and no BLOCKING hook ran it. That is how #924 happened: a mangled character class in
      # `compiler/self-host/tab.scrml` made `isAttrIdentPart` return false for every character and
      # turned a tokenizer loop into an unbounded allocator (an 82 GB host lockup, a day lost, three
      # hard resets, unattributed for sessions).
      #
      # ⚑ PRECISION, because the looser claim ("run by no hook") is FALSE and this file is in the
      # business of not shipping reassuring comments: `.git/hooks/post-commit` DOES run
      # `bun test compiler/tests/`, which includes self-host. It simply cannot gate anything — it runs
      # AFTER the commit — and it greps `\d+ fail` to print "TEST REGRESSION DETECTED", which the
      # browser tier's 48 baselined failures trigger on EVERY compiler-touching commit. A permanently
      # red advisory is not coverage; it is the cry-wolf shape this mechanism replaces. Pointing that
      # hook at `tier-baseline.ts --check` would make it carry information; not done here.
      #
      # BLOCKING rather than tracked, on three measured grounds — see the KEY FINDING block at the top
      # of this file for the numbers:
      #   · DIST-INDEPENDENT. The exclusion claim ("needs a locally-built, gitignored dist that CANNOT
      #     be rebuilt on a clean checkout") is FALSE for this directory; it was measured with the dist
      #     moved out AND in a checkout that never had it. Identical failure NAME SET both ways.
      #   · FAST. Under 0.6s for 264 tests — it costs this job nothing.
      #   · A KNOWN, SMALL BASELINE. 3 token-count parity failures, recorded by name, ZERO
      #     env-exclusions. So the gate can carry a condition (`the same 3, no more, no fewer`) rather
      #     than an exit code that is permanently 1.
      #
      # The 3 baselined failures are a SEPARATE arc and are deliberately not fixed here. A name joining
      # OR leaving that set fails this step, which is the bidirectional property that keeps the
      # baseline from going stale in silence.
      #
      # ⛔ WHAT THIS STEP DOES NOT ASSERT, SAID AT THE CALL SITE RATHER THAN LEFT IMPLICIT. It asserts
      # the failure NAME SET and NOTHING ELSE — no floor on pass count, skip count, or assertions
      # executed. That limit is sharpest exactly here: this tier is 122 SKIPPED of 264 at baseline,
      # and `bs.test.js` self-skips its whole 52-test block when `bs.scrml` fails to compile. So a
      # regression that converts PASSES into SKIPS leaves all 3 names intact and this step GREEN while
      # coverage collapses. Tracked as `g-no-baseline-asserts-that-tests-actually-asserted`.
      # ⚑ A count floor is deliberately NOT built here — that gap names the three baselines it would
      # have to span, and bolting a one-off onto this step would pre-empt that design. The obligation
      # discharged here is VISIBILITY: the next reader of this gate learns its limit from the gate.
      #
      # ⛑ AND THE TIER IS NOT SIDE-EFFECT-FREE — see the `self-host` registry entry in
      # scripts/tier-baseline.ts for the measurement. Running it WRITES `compiler/self-host/dist/`
      # (bs.css + bs.js) even though the compile FAILS, which satisfies the bare `existsSync` guards in
      # `compiler/tests/integration/self-host-smoke.test.js:665`, flipping that block from SKIP to
      # running against a failed-compile artifact. Harmless TODAY only because `integration` lives in
      # the `tracking` job — a different runner, a different checkout. ⛔ THE STANDING PLAN AT THE TOP
      # OF THIS FILE IS TO PROMOTE `integration` INTO `gate`. Whoever does that must order these two
      # steps deliberately, or dist-guard the smoke test first. It is luck of layout, not a property.
      - name: Self-host tier failure NAME-SET gate (S409 — the 82 GB lockup lived in an ungated directory)
        # STEP-LEVEL BUDGET, TIGHTER THAN THE JOB'S, AND IT IS THE POINT OF THE STEP.
        # Measured at 0.72s locally for 264 tests. 3 minutes is ~250x that — no slow runner flaps it —
        # while still preempting the exact failure mode this step exists to catch: #924's SYNCHRONOUS
        # non-advancing tokenizer loop, which bun's per-test timeout cannot interrupt and which the
        # script's own `!ranOk` / OOM paths cannot see (one needs bun to exit, the other needs the loop
        # to allocate). Without this, a recurrence consumes the whole job budget and reports nothing
        # about WHERE it hung. With it, the failure names the step.
        timeout-minutes: 3
        run: bun scripts/tier-baseline.ts --tier=self-host --check
      - name: Snippet gate (every public-cited .scrml still compiles)
        run: bun scripts/snippet-gate.js
      # ABSOLUTE floor (NOT differential): every shipped showcase PROGRAM (examples/* + multi-file
      # example/benchmark apps) must build on HEAD. corpus-emit-differential is base-vs-head and by its
      # HARD REQ 5 treats compile-failure as DATA, so a program broken since before the baseline is
      # invisible to it — that is how examples/09 failed to compile from S236 uncaught for months
      # (g-corpus-differential-gate-blind-to-standing-breakage). Known-broken programs are baselined
      # (scripts/corpus-compile-floor.baseline.json, each naming its gap); a NEW break — or a stale
      # baseline entry — fails.
      - name: Compile-floor gate (every showcase program still builds on HEAD)
        run: bun scripts/corpus-compile-floor.ts --check
      - name: Facts gate (published figures still match the repo)
        run: bun scripts/facts.ts --check
      # S409 — an unresolved merge conflict reached `main` at e74f5423 (#900) and this job was GREEN.
      # `compiler/SPEC-INDEX.md` carried three raw markers around 117 duplicated rows; it is a
      # mandatory full-read at every Profile-A PA boot, so the next session read a doubled navigation
      # table as truth. Nothing here looked at file well-formedness. Backlog at introduction: ZERO
      # (swept across all 8,170 tracked files), which is the pa-base §8 condition for adding a gate.
      - name: Conflict-marker gate (no unresolved merge markers on the trunk)
        run: bun scripts/conflict-marker-gate.ts
      # S409 — was "SPEC-INDEX totals gate". It checked ONLY the two numbers in the @generated totals
      # block, so it passed on the #900 file while 117 rows were duplicated: working correctly,
      # measuring what it was built to measure, and not an answer to "is this map well-formed".
      # Now also gates every Sections row's range/size AND asserts the scan reached all 71 sections
      # (a stray line ends the table scan, and a zero over a partial scan is a smaller measurement,
      # not a pass — pa-base §8's truncated probe). Rationale for the change + the superseded
      # decision it overturns are recorded in the script header per Rule 4b.
      - name: SPEC-INDEX currency gate (totals + every row's range + full-scan coverage)
        run: bun run scripts/regen-spec-index.ts --check
      # SPEC §34.0 — a NEW catalog row must state where it fires, or honestly declare it does not yet.
      # DIFF-SCOPED: silent on the legacy corpus by construction (pa-base §8 — a gate that is instantly
      # red for reasons no change caused gets bypassed, then deleted).
      # The delta-log sequence is a shared counter and its own header still claimed a
      # single-writer rule that stopped being true when the project went to two concurrent
      # operators. A duplicate is not cosmetic: the flogence bridge checkpoints on the
      # sequence, so the second entry to merge reads as already-absorbed and DROPS OUT of
      # the digest. BASELINED (handOffs/delta-log-dupes.baseline.json) so it is not
      # instantly red on nine pre-existing collisions — only a NEW duplicate fails.
      - name: delta-log sequence gate (a duplicate silently drops an entry from the digest)
        run: bun scripts/delta-lint.ts
      - name: §34.0 row-provenance gate (new error-code rows state where they fire)
        run: bun scripts/s34-census.ts --check-new --base ${{ github.event.pull_request.base.sha || 'HEAD~1' }}

  tracking:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --frozen-lockfile
      # S365 — the compiler's own TypeScript diagnostics do not grow silently.
      #
      # NON-BLOCKING BY TWO MECHANISMS, ON PURPOSE. The job is `continue-on-error`, and so is
      # this STEP. The step-level flag is not redundant: a failed step HALTS the job even in a
      # continue-on-error job (verified on run 30742472551, where the within-node parity step
      # reported `skipped` and had never run at all). Without it, a types regression would
      # silently suppress every tracking signal below it — the exact failure this job exists
      # to avoid.
      #
      # PLACED FIRST because it needs neither `pretest` nor a populated dist, so it cannot be
      # skipped by an earlier step's failure. Promotion into the BLOCKING `gate` job remains an
      # operator call and is NOT taken here; it wants a decision on the nine live `never`
      # failures first (fix, or record and drain).
      - name: Types gate (diagnostic NAME-SET vs compiler/tests/TYPES-BASELINE.json)
        continue-on-error: true
        run: bun scripts/types-gate.ts --check
      - name: Populate browser-test fixtures
        run: bun run pretest
      - name: integration + lsp + commands (promotion candidates — integration needs self-host-smoke dist-guarded)
        run: bun test compiler/tests/integration compiler/tests/lsp compiler/tests/commands
      # S313 (bryan's Q6) — assert the browser tier's failure NAME SET, not its exit code.
      #
      # The tier always exits 1 (a documented ~48-failure baseline), so `bun test compiler/tests/browser`
      # was PERMANENTLY red — which made it useless in both directions at once: a real regression was
      # invisible (red either way), and because a failed step HALTS the job, every step after it was
      # skipped. That second effect was verified, not assumed: on run 30742472551 the within-node
      # parity step below reports `skipped`, and had therefore never run at all — the S302 class
      # (13 of 14 root-level test files run by no workflow) recurring one job over.
      #
      # The name-set check exits 0 while the failure set is UNCHANGED and 1 the moment a name joins or
      # leaves it, so this step now carries information and the steps after it execute.
      #
      # ⛑ S409: renamed `scripts/browser-baseline.ts` -> `scripts/tier-baseline.ts --tier=browser`.
      # Behaviour-identical (proven by diffing both scripts' output in the same environment); the flag
      # is the whole change. Note this job does NOT build benchmarks/todomvc/dist, so unlike the `gate`
      # copy the two env-exclusions are live here — the PASS line prints the skip-rate either way.
      - name: Browser tier — failure NAME-SET assertion (not exit code)
        run: bun scripts/tier-baseline.ts --tier=browser --check
      # NOTE (label accuracy — g-ci-does-not-run-root-level-test-files): this step runs ONLY the
      # within-node parity file. The canary (parser-conformance-canary.test.js) is NOT run here — it
      # is gated in the BLOCKING `gate` job by the `*.test.js` root glob above ("Root-level
      # parser/native conformance (S302)"). The step name is kept truthful to its command so an
      # auditor reading "is the canary covered?" is not misled into thinking THIS step covers it.
      - name: Within-node parser-parity (M6.x native-parser migration backlog — tracking; canary gated in the blocking `gate` job)
        run: bun test compiler/tests/parser-conformance-within-node.test.js

  windows:
    # NON-BLOCKING (continue-on-error) — surfaces OS-path-separator regressions on every PR without gating
    # merges on a currently-imperfect Windows state. scrml's compiler has repeated Windows path-sensitivity
    # bugs (issue #25 nested-pages prefix, #26 isStdlibFilePath auth-bypass — both `\` vs `/`), invisible on
    # the Linux `gate`. Runs the dist-independent core (unit + conformance — "reproducibly green from source,
    # no dist/env deps") on windows-latest so a Windows-only classifier/path bug goes RED here, visibly.
    # Promote into the blocking `gate` (add windows-latest to a matrix) once this is confirmed green.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        # S314 — skip puppeteer's chrome-headless-shell download. This job runs ONLY
        # unit + conformance (no browser tier), so the browser is never used here; the
        # download was pure cost AND a flake source. Witnessed on PR #382: `ECONNRESET`
        # in the postinstall failed `Install deps` before a single test ran, while a
        # sibling run of IDENTICAL content passed. A job whose whole purpose is to
        # surface OS-path regressions reading red for a network hiccup destroys the
        # signal it exists to give. `gate` still downloads it — the browser NAME-SET
        # assertion needs a real browser.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: bun install --frozen-lockfile
      - name: Unit + conformance on Windows (catches `\` vs `/` OS-path bugs — #25/#26 class)
        run: bun test compiler/tests/unit compiler/tests/conformance
